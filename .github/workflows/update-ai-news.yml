name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    # Manual runs from feature branches must not publish or push to main.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: npm install --global pnpm@7.33.7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate storage regression tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Prepare OPML (optional)
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          else
            echo "No FOLLOW_OPML_B64 secret provided; RSS OPML is optional"
          fi

      - name: Update data
        run: pnpm run fetch

      - name: Generate OPML JSON
        run: pnpm exec tsx src/generate-opml-json.ts

      - name: Build web
        env:
          GITHUB_PAGES: true
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir -p dist/data
          cp ../data/latest-24h.json dist/data/
          cp ../data/latest-7d.json dist/data/
          cp ../data/source-status.json dist/data/
          cp ../data/opml-feeds.json dist/data/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      # The official upload-pages-artifact composite calls an unpinned
      # upload-artifact@v4 internally. Package the same tar format here so the
      # complete dependency chain can use a small, exact SHA allowlist.
      - name: Package Pages artifact
        run: |
          tar --dereference --hard-dereference --directory web/dist \
            --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # Persistence is best-effort; the fresh Pages artifact above must still
      # deploy if a push is rejected (size guard, branch policy, or concurrent edit).
      - name: Commit and push changes
        id: persist
        continue-on-error: true
        run: bash scripts/commit-data.sh

      - name: Report persistence failure
        if: steps.persist.outcome == 'failure'
        run: |
          echo "::warning::Snapshot persistence failed; Pages will still deploy fresh news. Check the commit step."
          echo "### Snapshot persistence failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Fresh news will still deploy. Inspect the commit step before the next run; archive/cache changes were not saved." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
